[workspace]
members = [ "crates/fila-server", "crates/fila-broker", "crates/fila-codec" ]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/faiscadev/fila"

[workspace.dependencies.fila-broker]
path = "crates/fila-broker"
version = "0.1.0"

[workspace.dependencies.fila-codec]
path = "crates/fila-codec"
version = "0.1.0"
